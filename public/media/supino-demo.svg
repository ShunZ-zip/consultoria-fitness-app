<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="Demonstração fictícia: supino reto">
  <rect width="400" height="290" fill="#0E1B2B"/>
  <text x="200" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#E6EAED">SUPINO RETO · DEMONSTRAÇÃO FICTÍCIA</text>
  <text x="200" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#E6EAED" opacity=".7">Substitua pela animação oficial licenciada</text>
  <g transform="translate(0 50)">
    <!-- banco -->
    <rect x="90" y="170" width="220" height="14" rx="4" fill="#E6EAED" opacity=".35"/>
    <rect x="120" y="184" width="10" height="36" fill="#E6EAED" opacity=".35"/><rect x="270" y="184" width="10" height="36" fill="#E6EAED" opacity=".35"/>
    <!-- pessoa deitada -->
    <circle cx="125" cy="150" r="14" fill="none" stroke="#E6EAED" stroke-width="5"/>
    <path d="M140 160 L270 160 M270 160 L300 190 M270 160 L292 130" fill="none" stroke="#E6EAED" stroke-width="6" stroke-linecap="round"/>
    <!-- braços e barra animados -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -62; 0 0" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1"/>
      <path d="M190 156 L190 118" stroke="#1A73E9" stroke-width="7" stroke-linecap="round"/>
      <rect x="120" y="108" width="140" height="6" rx="3" fill="#E6EAED"/>
      <rect x="112" y="92" width="10" height="38" rx="3" fill="#1A73E9"/><rect x="258" y="92" width="10" height="38" rx="3" fill="#1A73E9"/>
    </g>
  </g>
</svg>
